name: passwordzzz_v2
description: "A fast, beautiful, genuinely secure password manager"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---- State management ----
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0

  # ---- DI & navigation ----
  get_it: ^9.2.1
  go_router: ^17.0.0

  # ---- Local database ----
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5

  # ---- Cloud (Phase 3) ----
  supabase_flutter: ^2.15.4

  # ---- Crypto ----
  cryptography_plus: ^3.0.0   # AES-GCM, X25519, HKDF
  dargon2_flutter: ^3.3.0     # Argon2id for the recovery-code KDF
  crypto: ^3.0.7              # SHA-1 prefix for HIBP k-anonymity
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.1

  # ---- Device pairing (Phase 4) ----
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # ---- Models / serialization ----
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.6.0

  # ---- UI ----
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  drift_dev: ^2.32.1

  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-full.png
    - assets/logo-small.png
    - assets/google-logo.png
    - assets/apple-logo.png
